name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: pip install numpy requests PyMuPDF python-docx Pillow pytesseract
      - name: Compile
        run: python -m compileall -q studyforge app.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
