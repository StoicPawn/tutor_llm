services:
  tutor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DEPLOY_MODE: server
      INFERENCE_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma}
      STUDYFORGE_DB: /data/studyforge.db
      STUDYFORGE_UPLOADS: /data/uploads
      OCR_LANG: ${OCR_LANG:-ita+eng}
    volumes:
      - tutor_data:/data
    ports:
      # Bind only to localhost by default. Expose remotely through a private tunnel
      # such as Tailscale Serve rather than publishing Tutor LLM directly on Internet.
      - "127.0.0.1:${TUTOR_PORT:-8000}:8000"
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # Ollama is intentionally not published to the host/network. Tutor Core reaches it
    # only through the private Docker network.

volumes:
  tutor_data:
  ollama_models:
