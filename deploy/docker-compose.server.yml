services:
  tutor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DEPLOY_MODE: server
      INFERENCE_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma}
      STUDYFORGE_DB: /data/studyforge.db
      STUDYFORGE_UPLOADS: /data/uploads
      OCR_LANG: ${OCR_LANG:-ita+eng}
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required in server mode}
      RESEARCH_LAB_URL: ${RESEARCH_LAB_URL:-http://research-lab:8300}
      RESEARCH_LAB_TOKEN: ${RESEARCH_LAB_TOKEN:-}
    volumes:
      - tutor_data:/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:${TUTOR_API_PORT:-8201}:8000"
    networks:
      - default
      - home-lab
    depends_on:
      - ollama

  tutor-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    restart: unless-stopped
    environment:
      DEPLOY_MODE: server
      INFERENCE_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma}
      STUDYFORGE_DB: /data/studyforge.db
      STUDYFORGE_UPLOADS: /data/uploads
      OCR_LANG: ${OCR_LANG:-ita+eng}
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required in server mode}
      RESEARCH_LAB_URL: ${RESEARCH_LAB_URL:-http://research-lab:8300}
      RESEARCH_LAB_TOKEN: ${RESEARCH_LAB_TOKEN:-}
    volumes:
      - tutor_data:/data
    ports:
      - "127.0.0.1:${TUTOR_WEB_PORT:-8200}:8501"
    networks:
      - default
      - home-lab
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-60s}
    volumes:
      - ollama_models:/root/.ollama

volumes:
  tutor_data:
  ollama_models:

networks:
  home-lab:
    external: true
    name: home-lab
